
<article class="product-card">
  <img [src]="product().thumbnail" [alt]="product().title">

  <h2>{{ product().title }}</h2>

  <p>{{ product().description }}</p>

  <p class="price">${{ product().price }}</p>

  <p>Rating: {{ product().rating }} / 5</p>

  <button type="button" (click)="addToCart()">
    Add to Cart
  </button>
</article>
