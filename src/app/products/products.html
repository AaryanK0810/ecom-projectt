<h1>Product Store</h1>

<app-search (searchChanged)="onSearchChanged($event)" />

@if (loading()) {
  <p>Loading products...</p>
} @else if (error()) {
  <p>{{ error() }}</p>
} @else {
  <div class="product-grid">
    @for (product of filteredProducts(); track product.id) {
      <app-product-card [product]="product" />
    } @empty {
      <p>No products found.</p>
    }
  </div>
}
