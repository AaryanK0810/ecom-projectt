<h1>Our Products</h1>

@if (loading()) {
  <p>Loading products...</p>
}

@if (error()) {
  <p>{{ error() }}</p>
}

@if (!loading() && !error()) {
  <div class="product-grid">
    @for (product of products(); track product.id) {
      <article class="product-card">
        <img
          [src]="product.thumbnail"
          [alt]="product.title"
        >

        <h2>{{ product.title }}</h2>

        <p>{{ product.description }}</p>

        <p class="price">
          ${{ product.price }}
        </p>

        <p>Rating: {{ product.rating }} / 5</p>
      </article>
    }
  </div>
}
